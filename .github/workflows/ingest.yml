name: ingest

# Ingère les nouvelles sources de /raw dans le wiki via un agent Claude Code.
# L'agent n'écrit QUE dans wiki/ ; le commit ne stage que wiki/ -> aucun commit
# ne retouche raw/, donc le filtre `paths: raw/**` ne re-déclenche jamais l'Action.
on:
  push:
    paths:
      - 'raw/**'
  workflow_dispatch: {}
  schedule:
    # Rattrapage nocturne (23h UTC) : dépôts git manuels + runs échoués.
    - cron: '0 23 * * *'

# Sérialise les runs : deux uploads rapprochés ne se marchent pas dessus.
concurrency:
  group: wiki-ingest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détecte les fichiers à traiter
        id: detect
        run: |
          set -euo pipefail
          # Fichiers de contenu (hors README et sidecars .meta.md)
          find raw -maxdepth 1 -type f ! -name 'README.md' ! -name '*.meta.md' -printf '%f\n' \
            | LC_ALL=C sort > /tmp/all_content.txt
          # Clés déjà ingérées
          jq -r '.files | keys[]' wiki/_ingested.json | LC_ALL=C sort > /tmp/ingested.txt
          # Pending = contenu - ingéré
          comm -23 /tmp/all_content.txt /tmp/ingested.txt > /tmp/pending.txt || true
          count=$(wc -l < /tmp/pending.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "== $count fichier(s) à traiter =="
          cat /tmp/pending.txt || true

      - name: Setup Node
        if: steps.detect.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installe Claude Code
        if: steps.detect.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Ingestion
        if: steps.detect.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          PENDING="$(cat /tmp/pending.txt)"
          PROMPT="$(cat .github/prompts/ingest-prompt.md)

          ## Fichiers à ingérer lors de ce run (noms exacts dans raw/) :
          ${PENDING}"
          claude -p "$PROMPT" --permission-mode acceptEdits

      - name: Commit du wiki
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # On ne stage QUE wiki/ (garantit l'invariant anti-boucle).
          git add wiki/
          if git diff --cached --quiet; then
            echo "Aucune mise à jour du wiki (rien produit par l'agent)."
            exit 0
          fi
          git commit -m "chore(wiki): ingestion automatique depuis /raw [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Ouvre une issue si échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ingestion échouée — run #${context.runId}`,
              body: `Le workflow d'ingestion a échoué.\n\nDétails : ${run}\n\nLe cron nocturne retentera automatiquement (détection idempotente via wiki/_ingested.json).`,
              labels: ['ingestion', 'automated'],
            });
