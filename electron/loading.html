<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Second Brain — démarrage</title>
    <style>
      /* Écran d'attente 100 % local : aucune ressource externe (police système, CSS inline). */
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #0f6e56;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #e1f5ee;
        border-top-color: #0f6e56;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <div class="spinner" aria-hidden="true"></div>
    <div class="title">Démarrage de Second Brain…</div>
    <div class="sub">Préparation de ton wiki local</div>
  </body>
</html>
